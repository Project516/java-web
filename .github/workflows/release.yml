name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  jtreg:
    # prereleases are not published, so npm's latest tag only gets stable versions
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/jtreg.yml
    with:
      full: true

  publish:
    needs: jtreg
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm jdk
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Node entry on the built dist/
        run: node --expose-gc --test test/image.test.ts
      - run: npm publish
